name: intern-task-terraform ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
  push:
    branches: [main]
    paths:
      - "intern-task-terraform/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Fake, not secret — these never touch a real AWS account. They only
      # work because the module's provider block sets skip_credentials_validation
      # (see the task README). Nothing here is ever applied.
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Format check
        working-directory: intern-task-terraform/terraform
        run: terraform fmt -check -recursive

      - name: Initialize
        working-directory: intern-task-terraform/terraform
        run: terraform init

      - name: Validate
        working-directory: intern-task-terraform/terraform
        run: terraform validate

      - name: Plan
        working-directory: intern-task-terraform/terraform
        run: terraform plan
